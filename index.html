<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stellar Woodworking — From Our Shop to Your Home.">
  <title>Stellar Woodworking | Coming Soon</title>
  <link href="https://fonts.cdnfonts.com/css/scriptina-pro" rel="stylesheet">
  <style>
    :root{--black:#11110f;--cream:#f5f2ea;--gold:#d8b24c}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{font-family:Georgia,"Times New Roman",serif;background:var(--black);color:#fff}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2.5rem 2rem}
    .content{width:min(100%,1100px);text-align:center}
    .logo{display:block;width:150px;height:150px;object-fit:contain;margin:0 auto 2.75rem}
    h1{font-family:'Scriptina Pro',cursive;font-weight:300;font-size:clamp(4.2rem,10vw,8rem);line-height:.9;color:var(--cream)}
    .tagline{margin:2.35rem auto 0;max-width:760px;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.6;color:#d7d3c8;font-style:italic}
    .rule{width:80px;height:1px;background:var(--gold);margin:2rem auto}
    .message{font-family:Arial,Helvetica,sans-serif;color:#aaa69d;font-size:.9rem;letter-spacing:.04em}
    @media(max-width:560px){
      .page{padding:1.75rem 1.25rem}
      .logo{width:105px;height:105px;margin-bottom:2.25rem}
      h1{font-size:clamp(3.5rem,18vw,5.5rem)}
      .tagline{font-size:1rem;margin-top:1.8rem}
      .message{font-size:.82rem}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <img class="logo" src="assets/stellar-logo.png" alt="Stellar Woodworking logo">
      <h1>From Our Shop<br>to Your Home</h1>
      <p class="tagline">Crafting beautiful, lasting things with the gifts we've been given.</p>
      <div class="rule"></div>
      <p class="message">Our new website is being crafted. Check back soon.</p>
    </div>
  </main>
</body>
</html>
