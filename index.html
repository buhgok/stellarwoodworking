<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stellar Woodworking — From Our Shop to Your Home.">
  <title>Stellar Woodworking | Coming Soon</title>
  <link href="https://fonts.cdnfonts.com/css/scriptina-pro" rel="stylesheet">
  <style>
    :root{--black:#11110f;--charcoal:#1b1b18;--cream:#f5f2ea;--gold:#d8b24c;--text:#24231f}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{font-family:Georgia,"Times New Roman",serif;background:var(--black);color:#fff}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .content{width:min(100%,1000px);text-align:center}
    .mark{width:112px;height:112px;margin:0 auto 2rem;border:1px solid rgba(216,178,76,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;padding:1rem}
    .mark span{font-family:Arial,Helvetica,sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.18em;color:var(--gold)}
    .eyebrow{font-family:Arial,Helvetica,sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:1.25rem}
    h1{font-family:'Scriptina Pro',cursive;font-weight:300;font-size:clamp(4.2rem,10vw,8rem);line-height:.9;color:#f1eee5}
    .tagline{margin:1.75rem auto 0;max-width:700px;font-size:clamp(1.05rem,2vw,1.35rem);line-height:1.6;color:#d7d3c8;font-style:italic}
    .rule{width:80px;height:1px;background:var(--gold);margin:2rem auto}
    .message{font-family:Arial,Helvetica,sans-serif;color:#aaa69d;font-size:.9rem;letter-spacing:.04em}
    @media(max-width:560px){.page{padding:1.5rem}.mark{width:88px;height:88px;margin-bottom:1.5rem}h1{font-size:clamp(3.5rem,18vw,5.5rem)}.tagline{font-size:1rem}.message{font-size:.82rem}}
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <div class="mark" aria-label="Stellar Woodworking"><span>STELLAR<br>WOODWORKING</span></div>
      <div class="eyebrow">Stellar Woodworking</div>
      <h1>From Our Shop<br>to Your Home</h1>
      <p class="tagline">Crafting beautiful, lasting things with the gifts we've been given.</p>
      <div class="rule"></div>
      <p class="message">Our new website is being crafted. Check back soon.</p>
    </div>
  </main>
</body>
</html>
