# Daily shop check. Loading the shop's product list keeps WOOD's free Supabase
# project active (free projects pause after about a week without activity),
# and the run fails, so GitHub emails you, if the shop can't load.
#
# Scheduled runs only happen from the default branch (main), and GitHub turns
# them off after 60 days with no repository activity; it emails before it does.
name: Daily shop check

on:
  schedule:
    - cron: "17 13 * * *" # every day at 13:17 UTC (morning in the US)
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load the shop's products
        run: |
          status=$(curl -sS -o products.json -w '%{http_code}' --retry 3 --retry-delay 20 --max-time 30 \
            https://stellarwoodworking.com/api/products)
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::The shop couldn't load its products (HTTP $status). If Supabase paused WOOD PROD, open the project in Supabase and choose Restore."
            head -c 300 products.json; echo
            exit 1
          fi
          echo "Products listed: $(grep -o '"id":' products.json | wc -l)"
